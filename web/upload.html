<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SurplusBite - Upload Photo</title>
    <style>
        /* =========================================
           1. CSS VARIABLES & RESET
           ========================================= */
        :root {
            --primary: #2f855a;
            --primary-light: #48bb78;
            --primary-dark: #22543d;
            --bg: #f0fdf4;
            --text-main: #1a202c;
            --text-muted: #718096;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 20px 40px -10px rgba(47, 133, 90, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px; /* Enables 3D space for the card */
        }

        /* =========================================
           2. BACKGROUND ANIMATIONS (Floating Orbs)
           ========================================= */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 20s infinite ease-in-out alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: #c6f6d5; top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #fefcbf; bottom: -50px; right: -50px; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: #bee3f8; top: 40%; left: 60%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* =========================================
           3. ENTRANCE ANIMATION & 3D CARD
           ========================================= */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            margin: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            
            /* 3D Tilt Setup */
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            
            /* Entrance Animation */
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Card Pulsing Glow during upload */
        .card.uploading {
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0% { box-shadow: var(--shadow); }
            50% { box-shadow: 0 0 40px rgba(72, 187, 120, 0.4); }
            100% { box-shadow: var(--shadow); }
        }

        /* =========================================
           4. TYPOGRAPHY & HEADER
           ========================================= */
        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px -5px rgba(47, 133, 90, 0.4);
            transform: translateZ(30px); /* 3D pop effect */
        }
        .logo svg { width: 32px; height: 32px; fill: white; }

        h1 { 
            font-size: 26px; 
            color: var(--primary-dark); 
            margin-bottom: 10px; 
            font-weight: 800;
            letter-spacing: -0.5px;
            transform: translateZ(20px); 
        }
        p { 
            color: var(--text-muted); 
            font-size: 15px; 
            line-height: 1.5;
            margin-bottom: 30px; 
            transform: translateZ(15px);
        }

        /* =========================================
           5. UPLOAD AREA & HOVER EFFECTS
           ========================================= */
        .upload-area {
            border: 2px dashed #cbd5e0;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 40px 20px;
            margin-bottom: 24px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateZ(10px);
        }
        
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary-light);
            background: #f0fff4;
            transform: translateZ(10px) scale(1.02);
            box-shadow: 0 10px 20px -10px rgba(47, 133, 90, 0.2);
        }

        .upload-area input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; z-index: 10;
        }

        .icon-upload {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
            transition: transform 0.3s ease;
        }
        .upload-area:hover .icon-upload { transform: translateY(-5px); }

        .upload-text { 
            font-weight: 700; 
            color: var(--primary); 
            display: block; 
            margin-bottom: 4px; 
            font-size: 16px;
        }
        .upload-subtext { font-size: 13px; color: #a0aec0; }

        /* Selected State */
        .upload-area.has-file {
            border-color: var(--primary);
            background: #e6fffa;
            border-style: solid;
        }
        .upload-area.has-file .icon-upload { transform: scale(1.2); }
        .upload-area.has-file .upload-text { color: var(--primary-dark); }

        /* =========================================
           6. BUTTON & MICRO-INTERACTIONS
           ========================================= */
        .btn-upload {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(47, 133, 90, 0.4);
            transform: translateZ(20px);
        }

        .btn-upload:hover:not(:disabled) {
            transform: translateZ(20px) translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(47, 133, 90, 0.5);
        }
        .btn-upload:active:not(:disabled) {
            transform: translateZ(20px) translateY(2px);
            box-shadow: 0 5px 10px -5px rgba(47, 133, 90, 0.4);
        }
        .btn-upload:disabled {
            background: #cbd5e0;
            box-shadow: none;
            cursor: not-allowed;
            transform: translateZ(20px);
        }

        /* Loading Animation (Spinner) */
        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-upload.loading .btn-text { display: none; }
        .btn-upload.loading .spinner { display: block; }

        /* =========================================
           7. STATUS MESSAGES
           ========================================= */
        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            transform: translateZ(10px);
        }
        #status.show { opacity: 1; transform: translateY(0) translateZ(10px); }
        #status.success { color: var(--primary); }
        #status.error { color: #e53e3e; }
    </style>
</head>
<body>

    <!-- Background Animations -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Main 3D Card -->
    <div class="card" id="ui-card">
        
        <div class="logo">
            <!-- Simple camera/leaf icon -->
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        </div>

        <h1>SurplusBite</h1>
        <p>Upload a photo of your surplus food or produce to generate thumbnails.</p>

        <div class="upload-area" id="drop-zone">
            <input type="file" id="file-input" accept="image/jpeg, image/png">
            <span class="icon-upload">📸</span>
            <span class="upload-text" id="file-label">Tap to select photo</span>
            <span class="upload-subtext">JPG or PNG up to 10MB</span>
        </div>

        <button id="upload-btn" class="btn-upload" disabled>
            <span class="btn-text">Upload Photo</span>
            <span class="spinner"></span>
        </button>

        <div id="status"></div>
    </div>

    <script>
        // CLOUD ENGINEER / FRONTEND INTEGRATION NOTE:
        // Replace this with the actual Lambda Function URL provided by the Cloud Engineer.
        const API_URL = "YOUR_LAMBDA_FUNCTION_URL_HERE"; 

        const card = document.getElementById('ui-card');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const fileLabel = document.getElementById('file-label');
        const uploadBtn = document.getElementById('upload-btn');
        const statusDiv = document.getElementById('status');
        
        let selectedFile = null;

        /* =========================================
           MOUSE ANIMATION: 3D Parallax Tilt
           ========================================= */
        // Only apply 3D tilt on devices with a mouse (prevents mobile weirdness)
        if (window.matchMedia("(pointer: fine)").matches) {
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });

            // Reset when mouse leaves window
            document.addEventListener('mouseleave', () => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
                card.style.transition = "transform 0.5s ease";
            });
            
            document.addEventListener('mouseenter', () => {
                card.style.transition = "transform 0.1s ease-out";
            });
        }

        /* =========================================
           FILE SELECTION MICRO-INTERACTIONS
           ========================================= */
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileLabel.textContent = selectedFile.name;
                dropZone.classList.add('has-file');
                uploadBtn.disabled = false;
                
                // Reset status
                statusDiv.className = "";
                statusDiv.textContent = "";
            }
        });

        /* =========================================
           UPLOAD LOGIC & LOADING ANIMATION
           ========================================= */
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            // Trigger Loading State
            uploadBtn.disabled = true;
            uploadBtn.classList.add('loading');
            card.classList.add('uploading');
            statusDiv.className = "";
            statusDiv.textContent = "Securing connection...";
            statusDiv.classList.add('show');

            try {
                // 1. Get presigned URL from our API
                const response = await fetch(`${API_URL}?filename=${encodeURIComponent(selectedFile.name)}`);
                if (!response.ok) throw new Error("Failed to get upload URL");
                
                const data = await response.json();
                
                statusDiv.textContent = "Uploading image to the cloud...";

                // 2. Upload the file directly to S3
                const uploadResponse = await fetch(data.upload_url, {
                    method: 'PUT',
                    headers: { 'Content-Type': selectedFile.type },
                    body: selectedFile
                });

                if (!uploadResponse.ok) throw new Error("Upload failed");

                // 3. Success!
                statusDiv.textContent = "Success! Your photo is being processed.";
                statusDiv.className = "success show";
                
                // Reset UI
                setTimeout(() => {
                    fileLabel.textContent = "Tap to select another photo";
                    dropZone.classList.remove('has-file');
                    uploadBtn.disabled = true;
                    selectedFile = null;
                    fileInput.value = "";
                }, 1000);

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Error: " + error.message;
                statusDiv.className = "error show";
                uploadBtn.disabled = false;
            } finally {
                // Remove Loading State
                uploadBtn.classList.remove('loading');
                card.classList.remove('uploading');
            }
        });
    </script>
</body>
</html>
